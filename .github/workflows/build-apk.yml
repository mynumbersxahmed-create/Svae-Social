
name: Build Social Downloader APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip SocialDownloader_Mobile_Cloud_Build.zip -d extracted
          cd extracted/SocialDownloader_Final
          sed -i 's/VERSION_1_8/VERSION_17/g' app/build.gradle
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialDownloader-APK
          path: extracted/SocialDownloader_Final/app/build/outputs/apk/debug/app-debug.apk
